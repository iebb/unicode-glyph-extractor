name: Extract latest release and draft
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Reextract unchanged sources'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: unicode-monthly
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out reusable extractor
        uses: actions/checkout@v4
        with:
          path: extractor
      - name: Check out glyph collection with dedicated write key
        uses: actions/checkout@v4
        with:
          repository: iebb/unicode-glyphs
          path: collection
          ssh-key: ${{ secrets.GLYPHS_DEPLOY_KEY }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: extractor/requirements.txt
      - name: Install extraction dependencies
        run: pip install -r extractor/requirements.txt
      - name: Check version discovery and compression regressions
        run: python extractor/scripts/test_updates.py
      - name: Check draft catalog and browser syntax
        run: |
          python collection/tools/test_catalog.py
          node --input-type=module --check < collection/docs/app.js
      - name: Discover, extract, audit and compress official specimens
        run: python extractor/scripts/update_glyph_repo.py --repo collection --work "$RUNNER_TEMP/unicode-update" ${{ inputs.force && '--force' || '' }}
      - name: Commit verified collection and navigation
        working-directory: collection
        run: |
          git config user.name 'unicode-glyphs CI'
          git config user.email 'unicode-glyphs-ci@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified source changes.'
            exit 0
          fi
          # Plane-sized commits keep individual pushes below GitHub's size limit.
          git reset
          staging_branch="ci-refresh-${GITHUB_RUN_ID}"
          for plane in U?? draft/U??; do
            if [ -d "$plane" ]; then
              git add -A -- "$plane"
              if ! git diff --cached --quiet; then
                git commit -m "Update verified Unicode specimens: $plane"
                git push origin "HEAD:refs/heads/$staging_branch"
              fi
            fi
          done
          git add -A
          git commit -m 'Update verified release and draft catalog, navigation and reports'
          git push origin HEAD:main
          git push origin --delete "$staging_branch" || true
